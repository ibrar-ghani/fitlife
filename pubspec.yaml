name: fitlife
description: "A Flutter project for FitLife app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & state management
  cupertino_icons: ^1.0.5
  get: ^4.6.6
  getwidget: ^7.0.0
  fl_chart: ^1.1.1
  lottie: ^3.3.2

  # Networking & utilities
  http: ^1.2.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  shared_preferences: ^2.3.2

  # Video & media
  youtube_player_flutter: ^9.1.3
  video_player: ^2.10.1
  chewie: ^1.13.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets (add your assets here)
  # assets:
  #   - assets/images/
  #   - assets/videos/

  # Fonts (example, add your custom fonts)
  # fonts:
